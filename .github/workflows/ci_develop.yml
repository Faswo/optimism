name: ci_develop

on:
  push:
    branches: [ "develop", "ci_develop" ]
    tags:
      - v*
  pull_request:
    branches: [ "develop" , "ci_develop"]


  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      target:
        description: 'compile package type, op-node/op-batcher/op-proposer'
        type: string
        default: op-node

jobs:
  compile-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: CheckOut Code
        #continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git credentials
        run: |
          echo "PAT_GAO_CI is set"
          git config --global credential.helper store
          git config --global url."https://${{ secrets.PAT_GAO_CI }}@github.com/".insteadOf "https://github.com/"
          git config --global --list
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: 'true'
      - name: Build
        id: build_step
        run: |
          TARGET=${{ github.event.inputs.target }}
          echo "Input Target is: ${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ]; then
            TARGET="op-node"
          fi
          echo "Building target: $TARGET"
          make $TARGET
          echo "target=${TARGET}" >> $GITHUB_OUTPUT
      - name: Set artifact name
        id: set_artifact_name
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ARTIFACT_NAME="${{ steps.build_step.outputs.target }}-${{ github.ref_name }}"
          else
            SHORT_COMMIT_ID=$(git rev-parse --short HEAD)
            ARTIFACT_NAME="${{ steps.build_step.outputs.target }}-${SHORT_COMMIT_ID}"
          fi
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
      - name: Archive binary (on tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

        run: |
          NEXUS_UPLOAD_URL="${{ secrets.NEXUS_URL }}/repository/${{ steps.build_step.outputs.target }}"
          ARTIFACT_NAME=${{ steps.set_artifact_name.outputs.ARTIFACT_NAME }}
          ARTIFACT_PATH="./${{ steps.build_step.outputs.target }}/bin/${{ steps.build_step.outputs.target }}"
          curl -u ${{ secrets.NEXUS_URL }}:${{ secrets.NEXUS_PWD }} \
               -X PUT "$NEXUS_UPLOAD_URL/$ARTIFACT_NAME" \
               -T $ARTIFACT_PATH \
               -H "Content-Type: application/octet-stream" \
               -v

